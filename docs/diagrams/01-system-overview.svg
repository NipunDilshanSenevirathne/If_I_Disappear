<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="884" viewBox="0 0 1200 884" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5e6f77"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="24" y="36" font-size="15" font-weight="700" fill="#44565f" text-anchor="start">People</text><rect x="24" y="48" width="368" height="96" rx="12" fill="#fdf1da" stroke="#e99b1e" stroke-width="1.8"/><text x="42" y="78" font-size="17" font-weight="700" fill="#13232b" text-anchor="start">The person leaving</text><text x="42" y="102.0" font-size="14.5" font-weight="400" fill="#44565f" text-anchor="start">films the house once, explaining it</text><text x="42" y="123.5" font-size="14.5" font-weight="400" fill="#44565f" text-anchor="start">in Sinhala or English</text><rect x="416" y="48" width="368" height="96" rx="12" fill="#fdf1da" stroke="#e99b1e" stroke-width="1.8"/><text x="434" y="78" font-size="17" font-weight="700" fill="#13232b" text-anchor="start">The people staying</text><text x="434" y="102.0" font-size="14.5" font-weight="400" fill="#44565f" text-anchor="start">prove each job before she leaves,</text><text x="434" y="123.5" font-size="14.5" font-weight="400" fill="#44565f" text-anchor="start">and ask for help while she is away</text><rect x="808" y="48" width="368" height="96" rx="12" fill="#fdf1da" stroke="#e99b1e" stroke-width="1.8"/><text x="826" y="78" font-size="17" font-weight="700" fill="#13232b" text-anchor="start">A QR sticker on an object</text><text x="826" y="102.0" font-size="14.5" font-weight="400" fill="#44565f" text-anchor="start">opens that one job and its clip;</text><text x="826" y="123.5" font-size="14.5" font-weight="400" fill="#44565f" text-anchor="start">offline too, once the pack is saved</text><line x1="600" y1="148" x2="600" y2="180" stroke="#5e6f77" stroke-width="2" marker-end="url(#head)"/><text x="612" y="169" font-size="13" font-weight="400" fill="#44565f" text-anchor="start">a private, signed link for each</text><rect x="24" y="184" width="1152" height="80" rx="14" fill="#ffffff" stroke="#e99b1e" stroke-width="1.8"/><text x="44" y="218" font-size="17" font-weight="700" fill="#13232b" text-anchor="start">Web app</text><text x="44" y="242" font-size="13.5" font-weight="400" fill="#44565f" text-anchor="start">React PWA · English and Sinhala · offline pack · print layouts</text><rect x="540.0" y="204" width="83.19999999999999" height="40" rx="20" fill="#fdf1da" stroke="#e99b1e" stroke-width="1.6"/><text x="581.6" y="229" font-size="15" font-weight="600" fill="#13232b" text-anchor="middle">Record</text><rect x="633.2" y="204" width="83.19999999999999" height="40" rx="20" fill="#fdf1da" stroke="#e99b1e" stroke-width="1.6"/><text x="674.8000000000001" y="229" font-size="15" font-weight="600" fill="#13232b" text-anchor="middle">Review</text><rect x="726.4000000000001" y="204" width="99.6" height="40" rx="20" fill="#fdf1da" stroke="#e99b1e" stroke-width="1.6"/><text x="776.2" y="229" font-size="15" font-weight="600" fill="#13232b" text-anchor="middle">Prove it</text><rect x="836.0000000000001" y="204" width="157.0" height="40" rx="20" fill="#fdf1da" stroke="#e99b1e" stroke-width="1.6"/><text x="914.5000000000001" y="229" font-size="15" font-weight="600" fill="#13232b" text-anchor="middle">Help · WhatsApp</text><rect x="1003.0000000000001" y="204" width="157.0" height="40" rx="20" fill="#fdf1da" stroke="#e99b1e" stroke-width="1.6"/><text x="1081.5" y="229" font-size="15" font-weight="600" fill="#13232b" text-anchor="middle">Card · stickers</text><line x1="600" y1="268" x2="600" y2="302" stroke="#5e6f77" stroke-width="2" marker-end="url(#head)"/><text x="612" y="291" font-size="13" font-weight="400" fill="#44565f" text-anchor="start">HTTPS · one API for the app, WhatsApp and the live check</text><rect x="24" y="306" width="1152" height="290" rx="16" fill="#f4f7f8" stroke="#10212a" stroke-width="2"/><text x="44" y="338" font-size="17" text-anchor="start"><tspan font-weight="700" fill="#13232b">If I Disappear server</tspan><tspan font-weight="400" fill="#44565f">  ·  FastAPI  ·  models read, code decides</tspan></text><rect x="44" y="356" width="270" height="104" rx="12" fill="#10212a" stroke="#10212a" stroke-width="1.8"/><text x="62" y="386" font-size="16" font-weight="700" fill="#ffffff" text-anchor="start">Walk-through pipeline</text><text x="62" y="410" font-size="14" font-weight="400" fill="#c9d5da" text-anchor="start">convert · hear · privacy</text><text x="62" y="431" font-size="14" font-weight="400" fill="#c9d5da" text-anchor="start">read · check · decide</text><rect x="326" y="356" width="270" height="104" rx="12" fill="#10212a" stroke="#10212a" stroke-width="1.8"/><text x="344" y="386" font-size="16" font-weight="700" fill="#ffffff" text-anchor="start">Three witnesses</text><text x="344" y="410" font-size="14" font-weight="400" fill="#c9d5da" text-anchor="start">words · pixels · second reading</text><text x="344" y="431" font-size="14" font-weight="400" fill="#c9d5da" text-anchor="start">rules pinned by SHA-256</text><rect x="608" y="356" width="270" height="104" rx="12" fill="#10212a" stroke="#10212a" stroke-width="1.8"/><text x="626" y="386" font-size="16" font-weight="700" fill="#ffffff" text-anchor="start">Proof checks</text><text x="626" y="410" font-size="14" font-weight="400" fill="#c9d5da" text-anchor="start">show me: SAM 3.1 + Muse Spark</text><text x="626" y="431" font-size="14" font-weight="400" fill="#c9d5da" text-anchor="start">tell me: Muse Spark + code</text><rect x="890" y="356" width="270" height="104" rx="12" fill="#10212a" stroke="#10212a" stroke-width="1.8"/><text x="908" y="386" font-size="16" font-weight="700" fill="#ffffff" text-anchor="start">Fenced help agent</text><text x="908" y="410" font-size="14" font-weight="400" fill="#c9d5da" text-anchor="start">emergencies first, then only</text><text x="908" y="431" font-size="14" font-weight="400" fill="#c9d5da" text-anchor="start">the steps she recorded</text><rect x="44" y="474" width="364" height="104" rx="12" fill="#eef2f4" stroke="#5e6f77" stroke-width="1.8"/><text x="62" y="504" font-size="16" font-weight="700" fill="#13232b" text-anchor="start">Hash-chained log</text><text x="62" y="528" font-size="14" font-weight="400" fill="#44565f" text-anchor="start">every model output, check and decision,</text><text x="62" y="549" font-size="14" font-weight="400" fill="#44565f" text-anchor="start">one folder per home, replayed by code</text><rect x="420" y="474" width="364" height="104" rx="12" fill="#10212a" stroke="#10212a" stroke-width="1.8"/><text x="438" y="504" font-size="16" font-weight="700" fill="#ffffff" text-anchor="start">Engine</text><text x="438" y="528" font-size="14" font-weight="400" fill="#c9d5da" text-anchor="start">jobs · coverage · the absence day by day</text><text x="438" y="549" font-size="14" font-weight="400" fill="#c9d5da" text-anchor="start">teaching plan · the questions she forgot</text><rect x="796" y="474" width="364" height="104" rx="12" fill="#10212a" stroke="#10212a" stroke-width="1.8"/><text x="814" y="504" font-size="16" font-weight="700" fill="#ffffff" text-anchor="start">Signed, scoped links</text><text x="814" y="528" font-size="14" font-weight="400" fill="#c9d5da" text-anchor="start">owner · person · one job per sticker</text><text x="814" y="549" font-size="14" font-weight="400" fill="#c9d5da" text-anchor="start">rotate once to revoke them all</text><line x1="600" y1="600" x2="600" y2="636" stroke="#5e6f77" stroke-width="2" marker-end="url(#head)"/><text x="612" y="625" font-size="13" font-weight="400" fill="#44565f" text-anchor="start">keys stay on the server · daily and lifetime spending caps</text><rect x="24" y="640" width="872" height="182" rx="16" fill="#eef4fb" stroke="#285890" stroke-width="1.8"/><text x="44" y="670" font-size="16" font-weight="700" fill="#13232b" text-anchor="start">Meta Model API</text><rect x="40" y="684" width="203" height="96" rx="12" fill="#ffffff" stroke="#285890" stroke-width="1.8"/><text x="54" y="714" font-size="15" font-weight="700" fill="#13232b" text-anchor="start">Muse Spark 1.3</text><text x="54" y="738.0" font-size="13.5" font-weight="400" fill="#44565f" text-anchor="start">reads · points · compares</text><text x="54" y="758.5" font-size="13.5" font-weight="400" fill="#44565f" text-anchor="start">checks · answers</text><rect x="251" y="684" width="203" height="96" rx="12" fill="#ffffff" stroke="#285890" stroke-width="1.8"/><text x="265" y="714" font-size="15" font-weight="700" fill="#13232b" text-anchor="start">Muse Wonder 1.0</text><text x="265" y="738.0" font-size="13.5" font-weight="400" fill="#44565f" text-anchor="start">second reader for</text><text x="265" y="758.5" font-size="13.5" font-weight="400" fill="#44565f" text-anchor="start">electricity, gas and fire</text><rect x="462" y="684" width="203" height="96" rx="12" fill="#ffffff" stroke="#285890" stroke-width="1.8"/><text x="476" y="714" font-size="15" font-weight="700" fill="#13232b" text-anchor="start">SAM 3.1</text><text x="476" y="738.0" font-size="13.5" font-weight="400" fill="#44565f" text-anchor="start">outlines · tracks</text><text x="476" y="758.5" font-size="13.5" font-weight="400" fill="#44565f" text-anchor="start">finds · blurs</text><rect x="673" y="684" width="203" height="96" rx="12" fill="#ffffff" stroke="#285890" stroke-width="1.8"/><text x="687" y="714" font-size="15" font-weight="700" fill="#13232b" text-anchor="start">Muse Voice Transcribe</text><text x="687" y="738.0" font-size="13.5" font-weight="400" fill="#44565f" text-anchor="start">English speech,</text><text x="687" y="758.5" font-size="13.5" font-weight="400" fill="#44565f" text-anchor="start">piece by piece</text><text x="44" y="806" font-size="12.5" font-weight="400" fill="#44565f" text-anchor="start" font-style="italic">They check each other: Muse Spark&#x27;s point must land inside SAM 3.1&#x27;s outline, and Muse Wonder re-reads every safety fact.</text><rect x="912" y="640" width="264" height="182" rx="16" fill="#e8f6f7" stroke="#0e7c86" stroke-width="1.8"/><text x="932" y="670" font-size="16" font-weight="700" fill="#13232b" text-anchor="start">Meta open weights</text><rect x="928" y="684" width="232" height="96" rx="12" fill="#ffffff" stroke="#0e7c86" stroke-width="1.8"/><text x="942" y="714" font-size="15" font-weight="700" fill="#13232b" text-anchor="start">Omnilingual ASR</text><text x="942" y="738.0" font-size="13.5" font-weight="400" fill="#44565f" text-anchor="start">Sinhala speech, self-hosted</text><text x="942" y="758.5" font-size="13.5" font-weight="400" fill="#44565f" text-anchor="start">12.4% character error rate</text><text x="932" y="806" font-size="12.5" font-weight="400" fill="#44565f" text-anchor="start" font-style="italic">measured on 189 Sinhala clips</text><rect x="24" y="848" width="20" height="20" rx="5" fill="#fdf1da" stroke="#e99b1e" stroke-width="2"/><text x="52" y="863" font-size="14" font-weight="400" fill="#44565f" text-anchor="start">A person</text><rect x="124.8" y="848" width="20" height="20" rx="5" fill="#10212a" stroke="#10212a" stroke-width="2"/><text x="152.8" y="863" font-size="14" font-weight="400" fill="#44565f" text-anchor="start">Code decides</text><rect x="256.0" y="848" width="20" height="20" rx="5" fill="#ffffff" stroke="#285890" stroke-width="2"/><text x="284.0" y="863" font-size="14" font-weight="400" fill="#44565f" text-anchor="start">A Meta model</text><rect x="387.2" y="848" width="20" height="20" rx="5" fill="#ffffff" stroke="#0e7c86" stroke-width="2"/><text x="415.2" y="863" font-size="14" font-weight="400" fill="#44565f" text-anchor="start">Meta open weights</text><rect x="556.4" y="848" width="20" height="20" rx="5" fill="#eef2f4" stroke="#5e6f77" stroke-width="2"/><text x="584.4" y="863" font-size="14" font-weight="400" fill="#44565f" text-anchor="start">Kept on disk</text></svg>