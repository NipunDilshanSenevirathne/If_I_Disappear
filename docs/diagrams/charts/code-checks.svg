<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="190" viewBox="0 0 1000 190" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5e6f77"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="24" y="34" font-size="18" font-weight="700" fill="#13232b" text-anchor="start">With no model at all: the code checks, run on every commit</text><rect x="24" y="54" width="228" height="118" rx="12" fill="#f7f9fa" stroke="#dce3e6" stroke-width="1"/><text x="42" y="98" font-size="30" font-weight="700" fill="#13232b" text-anchor="start">81 of 81</text><text x="42" y="124" font-size="14" font-weight="400" fill="#13232b" text-anchor="start">misquotes caught</text><text x="42" y="150" font-size="12" font-weight="400" fill="#44565f" text-anchor="start">0 of 105 harmless variants failed</text><rect x="266" y="54" width="228" height="118" rx="12" fill="#f7f9fa" stroke="#dce3e6" stroke-width="1"/><text x="284" y="98" font-size="30" font-weight="700" fill="#13232b" text-anchor="start">16 of 16</text><text x="284" y="124" font-size="14" font-weight="400" fill="#13232b" text-anchor="start">secrets hidden</text><text x="284" y="150" font-size="12" font-weight="400" fill="#44565f" text-anchor="start">0 of 15 ordinary sentences touched</text><rect x="508" y="54" width="228" height="118" rx="12" fill="#f7f9fa" stroke="#dce3e6" stroke-width="1"/><text x="526" y="98" font-size="30" font-weight="700" fill="#13232b" text-anchor="start">12 of 12</text><text x="526" y="124" font-size="14" font-weight="400" fill="#13232b" text-anchor="start">medical instructions refused</text><text x="526" y="150" font-size="12" font-weight="400" fill="#44565f" text-anchor="start">1 of 10 ordinary refused by mistake</text><rect x="750" y="54" width="228" height="118" rx="12" fill="#f7f9fa" stroke="#dce3e6" stroke-width="1"/><text x="768" y="98" font-size="30" font-weight="700" fill="#13232b" text-anchor="start">8 of 8</text><text x="768" y="124" font-size="14" font-weight="400" fill="#13232b" text-anchor="start">Sinhala in mixed alphabets</text><text x="768" y="150" font-size="12" font-weight="400" fill="#44565f" text-anchor="start">sent to the owner&#x27;s review</text></svg>