<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5e6f77"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="24" y="24" width="300" height="236" rx="14" fill="#ffffff" stroke="#285890" stroke-width="2"/><path d="M24,38 a14,14 0 0 1 14,-14 h272 a14,14 0 0 1 14,14 v42 h-300 z" fill="#e3ecf8"/><line x1="24" y1="80" x2="324" y2="80" stroke="#285890" stroke-width="1"/><text x="42" y="50" font-size="17" font-weight="700" fill="#13232b" text-anchor="start">Muse Wonder 1.0</text><text x="42" y="70" font-size="12.5" font-weight="400" fill="#44565f" text-anchor="start">Meta Model API · the second reader</text><circle cx="46" cy="103" r="3" fill="#5e6f77"/><text x="58" y="108" font-size="14" font-weight="400" fill="#44565f" text-anchor="start">Re-reads every electricity, gas</text><text x="58" y="128" font-size="14" font-weight="400" fill="#44565f" text-anchor="start">and fire fact: the owner&#x27;s words,</text><text x="58" y="148" font-size="14" font-weight="400" fill="#44565f" text-anchor="start">the whole turn, the still and SAM</text><text x="58" y="168" font-size="14" font-weight="400" fill="#44565f" text-anchor="start">3.1&#x27;s box</text><circle cx="46" cy="191" r="3" fill="#5e6f77"/><text x="58" y="196" font-size="14" font-weight="400" fill="#44565f" text-anchor="start">May only uphold or flag, with a</text><text x="58" y="216" font-size="14" font-weight="400" fill="#44565f" text-anchor="start">reason in English and Sinhala. It</text><text x="58" y="236" font-size="14" font-weight="400" fill="#44565f" text-anchor="start">never rewrites a fact</text><rect x="450" y="24" width="300" height="364" rx="14" fill="#ffffff" stroke="#285890" stroke-width="2"/><path d="M450,38 a14,14 0 0 1 14,-14 h272 a14,14 0 0 1 14,14 v42 h-300 z" fill="#e3ecf8"/><line x1="450" y1="80" x2="750" y2="80" stroke="#285890" stroke-width="1"/><text x="468" y="50" font-size="17" font-weight="700" fill="#13232b" text-anchor="start">Muse Spark 1.3</text><text x="468" y="70" font-size="12.5" font-weight="400" fill="#44565f" text-anchor="start">Meta Model API · reads, points, compares</text><circle cx="472" cy="103" r="3" fill="#5e6f77"/><text x="484" y="108" font-size="14" font-weight="400" fill="#44565f" text-anchor="start">Reads each walk-through into</text><text x="484" y="128" font-size="14" font-weight="400" fill="#44565f" text-anchor="start">facts: strict JSON, in English</text><text x="484" y="148" font-size="14" font-weight="400" fill="#44565f" text-anchor="start">and Sinhala, with the exact</text><text x="484" y="168" font-size="14" font-weight="400" fill="#44565f" text-anchor="start">quote, its time, a noun and a</text><text x="484" y="188" font-size="14" font-weight="400" fill="#44565f" text-anchor="start">point on a still</text><circle cx="472" cy="211" r="3" fill="#5e6f77"/><text x="484" y="216" font-size="14" font-weight="400" fill="#44565f" text-anchor="start">Compares a family member&#x27;s photo</text><text x="484" y="236" font-size="14" font-weight="400" fill="#44565f" text-anchor="start">with the owner&#x27;s still, naming</text><text x="484" y="256" font-size="14" font-weight="400" fill="#44565f" text-anchor="start">what matches</text><circle cx="472" cy="279" r="3" fill="#5e6f77"/><text x="484" y="284" font-size="14" font-weight="400" fill="#44565f" text-anchor="start">Checks a spoken explanation point</text><text x="484" y="304" font-size="14" font-weight="400" fill="#44565f" text-anchor="start">by point, quoting the words that</text><text x="484" y="324" font-size="14" font-weight="400" fill="#44565f" text-anchor="start">cover each point</text><circle cx="472" cy="347" r="3" fill="#5e6f77"/><text x="484" y="352" font-size="14" font-weight="400" fill="#44565f" text-anchor="start">Runs the help line&#x27;s tool loop,</text><text x="484" y="372" font-size="14" font-weight="400" fill="#44565f" text-anchor="start">fenced by code</text><rect x="876" y="24" width="300" height="364" rx="14" fill="#ffffff" stroke="#285890" stroke-width="2"/><path d="M876,38 a14,14 0 0 1 14,-14 h272 a14,14 0 0 1 14,14 v42 h-300 z" fill="#e3ecf8"/><line x1="876" y1="80" x2="1176" y2="80" stroke="#285890" stroke-width="1"/><text x="894" y="50" font-size="17" font-weight="700" fill="#13232b" text-anchor="start">SAM 3.1</text><text x="894" y="70" font-size="12.5" font-weight="400" fill="#44565f" text-anchor="start">Meta Model API · outlines, tracks, finds</text><circle cx="898" cy="103" r="3" fill="#5e6f77"/><text x="910" y="108" font-size="14" font-weight="400" fill="#44565f" text-anchor="start">The pixels witness: outlines the</text><text x="910" y="128" font-size="14" font-weight="400" fill="#44565f" text-anchor="start">object Muse Spark named, on the</text><text x="910" y="148" font-size="14" font-weight="400" fill="#44565f" text-anchor="start">same still</text><circle cx="898" cy="171" r="3" fill="#5e6f77"/><text x="910" y="176" font-size="14" font-weight="400" fill="#44565f" text-anchor="start">Tracks the object through the</text><text x="910" y="196" font-size="14" font-weight="400" fill="#44565f" text-anchor="start">clip, prompted with Muse Spark&#x27;s</text><text x="910" y="216" font-size="14" font-weight="400" fill="#44565f" text-anchor="start">own point</text><circle cx="898" cy="239" r="3" fill="#5e6f77"/><text x="910" y="244" font-size="14" font-weight="400" fill="#44565f" text-anchor="start">Finds the object in a family</text><text x="910" y="264" font-size="14" font-weight="400" fill="#44565f" text-anchor="start">member&#x27;s photo before any</text><text x="910" y="284" font-size="14" font-weight="400" fill="#44565f" text-anchor="start">comparison</text><circle cx="898" cy="307" r="3" fill="#5e6f77"/><text x="910" y="312" font-size="14" font-weight="400" fill="#44565f" text-anchor="start">Finds credit cards, ID cards and</text><text x="910" y="332" font-size="14" font-weight="400" fill="#44565f" text-anchor="start">phone screens, so code can blur</text><text x="910" y="352" font-size="14" font-weight="400" fill="#44565f" text-anchor="start">them</text><line x1="324" y1="132" x2="448" y2="132" stroke="#285890" stroke-width="2" marker-end="url(#head)"/><text x="386" y="112" font-size="12.5" font-weight="400" fill="#44565f" text-anchor="middle">a second opinion</text><text x="386" y="156" font-size="12.5" font-weight="400" fill="#44565f" text-anchor="middle">on safety facts</text><line x1="750" y1="150" x2="874" y2="150" stroke="#285890" stroke-width="2" marker-end="url(#head)"/><text x="812" y="124" font-size="12.5" font-weight="400" fill="#44565f" text-anchor="middle">names the object</text><text x="812" y="140" font-size="12.5" font-weight="400" fill="#44565f" text-anchor="middle">and points at it</text><line x1="876" y1="214" x2="752" y2="214" stroke="#285890" stroke-width="2" marker-end="url(#head)"/><text x="812" y="238" font-size="12.5" font-weight="400" fill="#44565f" text-anchor="middle">its outline must</text><text x="812" y="254" font-size="12.5" font-weight="400" fill="#44565f" text-anchor="middle">contain the point</text><line x1="876" y1="304" x2="752" y2="304" stroke="#285890" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#head)"/><text x="812" y="328" font-size="12.5" font-weight="400" fill="#44565f" text-anchor="middle">frames the photos</text><text x="812" y="344" font-size="12.5" font-weight="400" fill="#44565f" text-anchor="middle">Spark compares</text><rect x="24" y="286" width="300" height="102" rx="14" fill="#10212a" stroke="#10212a" stroke-width="1.6"/><text x="42" y="314" font-size="16" font-weight="700" fill="#ffffff" text-anchor="start">Code decides</text><text x="42" y="338" font-size="13.5" font-weight="400" fill="#c9d5da" text-anchor="start">Quotes found word for word, the point</text><text x="42" y="357" font-size="13.5" font-weight="400" fill="#c9d5da" text-anchor="start">inside the outline, rules pinned by</text><text x="42" y="376" font-size="13.5" font-weight="400" fill="#c9d5da" text-anchor="start">SHA-256. No model decides alone.</text><rect x="24" y="420" width="278" height="214" rx="14" fill="#ffffff" stroke="#285890" stroke-width="2"/><path d="M24,434 a14,14 0 0 1 14,-14 h250 a14,14 0 0 1 14,14 v42 h-278 z" fill="#e3ecf8"/><line x1="24" y1="476" x2="302" y2="476" stroke="#285890" stroke-width="1"/><text x="42" y="446" font-size="17" font-weight="700" fill="#13232b" text-anchor="start">Muse Voice Transcribe</text><text x="42" y="466" font-size="12.5" font-weight="400" fill="#44565f" text-anchor="start">Meta Model API</text><circle cx="46" cy="499" r="3" fill="#5e6f77"/><text x="58" y="504" font-size="14" font-weight="400" fill="#44565f" text-anchor="start">English speech, cut at pauses</text><text x="58" y="524" font-size="14" font-weight="400" fill="#44565f" text-anchor="start">so each sentence keeps its</text><text x="58" y="544" font-size="14" font-weight="400" fill="#44565f" text-anchor="start">time</text><circle cx="46" cy="567" r="3" fill="#5e6f77"/><text x="58" y="572" font-size="14" font-weight="400" fill="#44565f" text-anchor="start">The family&#x27;s names as</text><text x="58" y="592" font-size="14" font-weight="400" fill="#44565f" text-anchor="start">keywords</text><rect x="314" y="420" width="278" height="214" rx="14" fill="#ffffff" stroke="#0e7c86" stroke-width="2"/><path d="M314,434 a14,14 0 0 1 14,-14 h250 a14,14 0 0 1 14,14 v42 h-278 z" fill="#dff2f4"/><line x1="314" y1="476" x2="592" y2="476" stroke="#0e7c86" stroke-width="1"/><text x="332" y="446" font-size="17" font-weight="700" fill="#13232b" text-anchor="start">Omnilingual ASR</text><text x="332" y="466" font-size="12.5" font-weight="400" fill="#44565f" text-anchor="start">Meta open weights · self-hosted</text><circle cx="336" cy="499" r="3" fill="#5e6f77"/><text x="348" y="504" font-size="14" font-weight="400" fill="#44565f" text-anchor="start">Sinhala speech: 12.4%</text><text x="348" y="524" font-size="14" font-weight="400" fill="#44565f" text-anchor="start">character error rate on 189</text><text x="348" y="544" font-size="14" font-weight="400" fill="#44565f" text-anchor="start">public clips, on CPU</text><circle cx="336" cy="567" r="3" fill="#5e6f77"/><text x="348" y="572" font-size="14" font-weight="400" fill="#44565f" text-anchor="start">Pieces in another alphabet</text><text x="348" y="592" font-size="14" font-weight="400" fill="#44565f" text-anchor="start">are never read</text><rect x="604" y="420" width="278" height="214" rx="14" fill="#ffffff" stroke="#285890" stroke-width="2"/><path d="M604,434 a14,14 0 0 1 14,-14 h250 a14,14 0 0 1 14,14 v42 h-278 z" fill="#e3ecf8"/><line x1="604" y1="476" x2="882" y2="476" stroke="#285890" stroke-width="1"/><text x="622" y="446" font-size="17" font-weight="700" fill="#13232b" text-anchor="start">Muse Image</text><text x="622" y="466" font-size="12.5" font-weight="400" fill="#44565f" text-anchor="start">Meta Model API</text><circle cx="626" cy="499" r="3" fill="#5e6f77"/><text x="638" y="504" font-size="14" font-weight="400" fill="#44565f" text-anchor="start">Made the sample home&#x27;s</text><text x="638" y="524" font-size="14" font-weight="400" fill="#44565f" text-anchor="start">photos, so SAM 3.1 finds</text><text x="638" y="544" font-size="14" font-weight="400" fill="#44565f" text-anchor="start">every object the owner names</text><text x="638" y="564" font-size="14" font-weight="400" fill="#44565f" text-anchor="start">(0.62 to 0.96)</text><rect x="894" y="420" width="278" height="214" rx="14" fill="#ffffff" stroke="#0e7c86" stroke-width="2"/><path d="M894,434 a14,14 0 0 1 14,-14 h250 a14,14 0 0 1 14,14 v42 h-278 z" fill="#dff2f4"/><line x1="894" y1="476" x2="1172" y2="476" stroke="#0e7c86" stroke-width="1"/><text x="912" y="446" font-size="17" font-weight="700" fill="#13232b" text-anchor="start">Muse Spark Open</text><text x="912" y="466" font-size="12.5" font-weight="400" fill="#44565f" text-anchor="start">Meta open weights · Fireworks AI</text><circle cx="916" cy="499" r="3" fill="#5e6f77"/><text x="928" y="504" font-size="14" font-weight="400" fill="#44565f" text-anchor="start">Every prompt was tested on it</text><text x="928" y="524" font-size="14" font-weight="400" fill="#44565f" text-anchor="start">first</text><circle cx="916" cy="547" r="3" fill="#5e6f77"/><text x="928" y="552" font-size="14" font-weight="400" fill="#44565f" text-anchor="start">The second column of the</text><text x="928" y="572" font-size="14" font-weight="400" fill="#44565f" text-anchor="start">evaluation</text><text x="600" y="676" font-size="15" font-weight="600" fill="#13232b" text-anchor="middle">Seven Meta models, each doing what it does best. The three at the top check each other&#x27;s work.</text><text x="600" y="702" font-size="14" font-weight="400" fill="#44565f" text-anchor="middle">What any model says reaches the family only after code has checked it.</text><rect x="340" y="730" width="20" height="20" rx="5" fill="#ffffff" stroke="#285890" stroke-width="2"/><text x="368" y="745" font-size="14" font-weight="400" fill="#44565f" text-anchor="start">Meta Model API</text><rect x="486.4" y="730" width="20" height="20" rx="5" fill="#ffffff" stroke="#0e7c86" stroke-width="2"/><text x="514.4" y="745" font-size="14" font-weight="400" fill="#44565f" text-anchor="start">Meta open weights</text><rect x="655.5999999999999" y="730" width="20" height="20" rx="5" fill="#10212a" stroke="#10212a" stroke-width="2"/><text x="683.5999999999999" y="745" font-size="14" font-weight="400" fill="#44565f" text-anchor="start">Code decides</text></svg>